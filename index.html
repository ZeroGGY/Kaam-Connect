<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>KaamConnect</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@500;700&display=swap">
<style>
:root{--bg:#f6f4ee;--card:#fff;--tx:#14213d;--mu:#667;--navy:#14213d;--gold:#c9a227;--bd:#e3dfd2;--bad:#b3261e;--ok:#1b7a43;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1526;--card:#16213a;--tx:#eee9d8;--mu:#9aa5bd;--bd:#2a3858;--navy:#0a1020;color-scheme:dark}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,Segoe UI,sans-serif}
header{background:var(--navy);color:#fff;padding:12px 16px;border-bottom:3px solid var(--gold);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
header b{color:var(--gold);font-size:18px;letter-spacing:.5px}header span{opacity:.8;font-size:13px}header button{margin-left:auto}
nav{display:flex;gap:6px;padding:10px 16px;overflow-x:auto;background:var(--card);border-bottom:1px solid var(--bd)}
nav button{white-space:nowrap}main{max-width:980px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:14px}
h2{margin:0 0 10px;color:var(--gold);font-size:18px}h3{margin:12px 0 6px;font-size:15px}
button{background:var(--navy);color:#fff;border:1px solid var(--gold);border-radius:7px;padding:7px 12px;cursor:pointer;font:inherit}
button.on{background:var(--gold);color:#14213d}button.g{background:transparent;color:var(--tx);border-color:var(--bd)}button.d{border-color:var(--bad);background:transparent;color:var(--bad)}
input,select,textarea{font:inherit;padding:7px;border:1px solid var(--bd);border-radius:7px;background:var(--bg);color:var(--tx);max-width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin:6px 0}.row label{display:flex;flex-direction:column;font-size:12px;color:var(--mu);gap:2px}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}td,th{padding:6px 8px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:top}
.pill{display:inline-block;padding:1px 8px;border-radius:99px;border:1px solid var(--gold);font-size:12px}.mu{color:var(--mu);font-size:13px}.bad{color:var(--bad)}.ok{color:var(--ok)}
#ov{position:fixed;inset:0;background:#000a;overflow:auto;padding:16px;z-index:9}
#inv{background:#fff;color:#14213d;max-width:760px;margin:0 auto;border-top:10px solid #14213d;border-bottom:4px solid #c9a227;padding:24px}
#inv th{background:#14213d;color:#c9a227}#inv td,#inv th{border-color:#ddd}
@media print{body>*:not(#ov){display:none!important}#ov{position:static;background:none;padding:0}.np{display:none!important}}
:root,:root:not([data-theme="light"]){--bg:#070d1f;--card:#0f1c3f;--tx:#fff7e0;--mu:#cdd6ee;--bd:#c9a22766;--navy:#0a1330;--gold:#ffc83d;--bad:#ff8a80;--ok:#5fe3a1;color-scheme:dark}
body{font-size:18px;font-family:'Noto Naskh Arabic',system-ui,sans-serif;background:radial-gradient(900px 500px at 85% -10%,#c9a22740,transparent 60%),radial-gradient(700px 500px at -10% 35%,#3b5bff33,transparent 60%),linear-gradient(160deg,#070d1f,#0d1a40 60%,#070d1f);background-attachment:fixed}
body.big{font-size:23px}
header{background:linear-gradient(100deg,#0a1330,#1a2d6b);border-bottom:4px solid var(--gold);padding:16px 20px;box-shadow:0 8px 30px #000a}
header b{font-size:32px;background:linear-gradient(90deg,#ffe28a,#ffc83d,#fff1b8);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo{font-size:36px;background:#ffc83d22;border:2px solid var(--gold);border-radius:14px;padding:2px 10px}.tag{font-size:15px;color:#dfe6ff}header span{color:#ffe9a6;font-weight:700;opacity:1}
.ctl{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}header button{margin:0;padding:7px 12px;min-height:40px}
.ur{font-family:'Noto Naskh Arabic',serif;direction:rtl;color:var(--gold);font-weight:700;margin-inline-start:.45em}
button .ur,th .ur,.pill .ur{color:inherit}.m-en .ur{display:none}.m-ur .en{display:none}.m-ur .ur{margin:0}
nav{position:sticky;top:0;z-index:5;background:#0a1330ee;backdrop-filter:blur(8px);border-bottom:1px solid var(--bd);padding:12px 16px}
main{padding:20px 16px}
.card{background:linear-gradient(160deg,#14275a,#0c1735);border:1.5px solid #c9a22788;border-radius:18px;box-shadow:0 10px 30px #0009,inset 0 1px 0 #ffffff18;padding:20px}
h2{font-size:25px;border-bottom:2px solid #c9a22755;padding-bottom:8px;margin-bottom:14px}h3{color:#ffe9a6;font-size:19px}
button{background:linear-gradient(180deg,#27409a,#13245a);border:1.5px solid var(--gold);border-radius:12px;padding:11px 18px;font-size:inherit;color:#fff;font-weight:700;min-height:46px;transition:.15s}
button:hover{transform:translateY(-2px);box-shadow:0 6px 18px #ffc83d55}button.on{background:linear-gradient(180deg,#ffe28a,#ffc83d);color:#0a1330;box-shadow:0 0 20px #ffc83d77}button.g{background:#ffffff12;color:var(--tx)}button.d{background:#ff8a8018}
input,select,textarea{font-size:inherit;font-family:inherit;background:#081027;color:#fff;border:1.5px solid #c9a22799;border-radius:10px;padding:10px 12px;min-height:46px}input:focus,select:focus{outline:3px solid var(--gold)}
.row label{font-size:15px;color:#ffe9a6;font-weight:700}th{color:var(--gold);font-size:15px}td,th{padding:11px 10px;border-bottom:1px solid #c9a22733}tr:hover td{background:#ffffff09}
.pill{background:#ffc83d22;border-width:1.5px;padding:2px 12px;font-weight:700;color:#fff3c4}
.hero{text-align:center;padding:26px 14px;margin-bottom:16px;border-radius:20px;border:2px solid var(--gold);background:linear-gradient(135deg,#1a2d6b,#0a1330);box-shadow:0 0 40px #ffc83d33}.hero h1{margin:0;font-size:34px;color:var(--gold)}.hero p{margin:6px 0 0;font-size:20px}
#inv,#inv *{font-family:'Noto Naskh Arabic',system-ui,sans-serif}#inv .mu{color:#555}#inv th{color:#ffc83d}
@media print{body{background:#fff!important}}
</style></head><body>
<header><div class="logo">🛠️</div><div><b>KaamConnect</b><div class="tag"><span class="en">Trusted home services</span><span class="ur">بھروسہ مند گھریلو خدمات</span></div></div><span id="who"></span><div class="ctl"><button class="g" onclick="setUI('l','en')">English</button><button class="g" onclick="setUI('l','ur')">اردو</button><button class="g" onclick="setUI('l','both')">EN + اردو</button><button class="on" onclick="setUI('b',UI.b?0:1)" title="Text size / متن کا سائز">A+</button><button class="g" id="out" onclick="logout()" style="display:none"><span class="en">Switch account</span><span class="ur">اکاؤنٹ بدلیں</span></button></div></header>
<nav id="nav"></nav><main id="m"></main><div id="ov" style="display:none"></div>
<script>
const K='kc_app_v1',TODAY=()=>new Date().toISOString().slice(0,10),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),rs=n=>'Rs. '+Number(n||0).toLocaleString();
const DEF=()=>({u:[],bk:[],ref:[],rw:[],rd:[],camp:{on:true,amt:500,minBk:1,expiry:90,maxDay:3},cats:['Air conditioner servicing|180','Electrical inspection|365','Plumbing maintenance|365','Water pump maintenance|180','Refrigerator servicing|365','Washing machine maintenance|365','Other household appliance|365'].map((s,i)=>({id:i+1,name:s.split('|')[0],days:+s.split('|')[1],tip:''})),rem:[],hist:[],inv:[],pay:[],aud:[],nt:[],cur:null,seq:1});
let S;try{S=JSON.parse(localStorage.getItem(K))||DEF()}catch(e){S=DEF()}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}},id=()=>S.seq++,me=()=>S.u.find(x=>x.id===S.cur),U=i=>S.u.find(x=>x.id===i)||{name:'—'};
const audit=(a,d)=>S.aud.unshift({at:new Date().toISOString(),by:me()?.name||'system',a,d});
const note=(u,t)=>S.nt.unshift({id:id(),u,t,at:TODAY(),rd:0});
const add=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x.toISOString().slice(0,10)};
let tab='';const TABS={customer:[['bk','Bookings'],['rf','My Referrals & Rewards'],['hm','Home Maintenance'],['iv','My Invoices']],technician:[['bk','Jobs'],['iv','Job Invoices'],['hs','Service History']],admin:[['rf','Referral & Rewards Mgmt'],['hm','Maintenance Mgmt'],['iv','Invoice Mgmt'],['py','Payment Records']]};
function logout(){S.cur=null;save();R()}
function R(){const u=me(),m=document.getElementById('m');document.getElementById('out').style.display=u?'':'none';document.getElementById('who').textContent=u?u.name+' · '+u.role:'';
 if(!u){document.getElementById('nav').innerHTML='';m.innerHTML=auth();return}
 due();const T=TABS[u.role];if(!T.some(t=>t[0]===tab))tab=T[0][0];
 document.getElementById('nav').innerHTML=T.map(t=>`<button class="${t[0]===tab?'on':'g'}" onclick="tab='${t[0]}';R()">${t[1]}</button>`).join('');
 const unread=S.nt.filter(n=>n.u===u.id);
 m.innerHTML=(unread.length?`<div class="card"><h2>Notifications (${unread.filter(n=>!n.rd).length} new)</h2>${unread.slice(0,5).map(n=>`<div>${n.rd?'':'● '}${esc(n.t)} <span class="mu">${n.at}</span></div>`).join('')}<button class="g" onclick="S.nt.forEach(n=>n.u===${u.id}&&(n.rd=1));save();R()">Mark read</button> <span class="mu">Push: not configured (see setup notes).</span></div>`:'')+V[u.role+tab]();}
function auth(){return `<div class="hero"><h1>🛠️ KaamConnect</h1><p><span class="en">Book trusted technicians, track maintenance, get clear invoices.</span><span class="ur">بھروسہ مند ٹیکنیشن بک کریں، دیکھ بھال کا ریکارڈ رکھیں، واضح انوائس حاصل کریں۔</span></p></div><div class="card"><h2>Create account</h2><p class="mu">Accounts and data are stored in this browser only. There is no server yet.</p><div class="row"><label>Name<input id="a_n"></label><label>Phone<input id="a_p"></label><label>Role<select id="a_r"><option>customer</option><option>technician</option><option>admin</option></select></label><label>Referral code (optional)<input id="a_c"></label><button onclick="signup()">Register</button></div></div>
<div class="card"><h2>Sign in</h2>${S.u.length?S.u.map(x=>`<button class="g" onclick="S.cur=${x.id};save();R()">${esc(x.name)} (${x.role})</button> `).join(''):'<span class="mu">No accounts yet.</span>'}</div>`}
function signup(){const n=a_n.value.trim(),p=a_p.value.replace(/\D/g,''),r=a_r.value,c=a_c.value.trim().toUpperCase();
 if(n.length<2||p.length<10)return alert('Enter a name and a valid phone number (10+ digits).');
 if(S.u.some(x=>x.phone===p))return alert('This phone number is already registered.');
 const u={id:id(),name:n,phone:p,role:r,at:new Date().toISOString(),code:r==='customer'?mk():null,pref:{days:7}};
 if(c&&r==='customer'){const o=S.u.find(x=>x.code===c);if(!o)return alert('Invalid referral code.');
  if(o.phone===p)return alert('Self-referral is not allowed.');
  const recent=S.ref.filter(x=>x.by===o.id&&Date.now()-new Date(x.at)<864e5).length;
  S.ref.push({id:id(),by:o.id,to:u.id,code:c,st:'registered',flag:recent>=S.camp.maxDay?'More than '+S.camp.maxDay+' referrals in 24h':'',at:new Date().toISOString()});}
 S.u.push(u);S.cur=u.id;audit('register',u.name+' ('+r+')');save();R()}
function mk(){let c;do c='KC-'+Math.random().toString(36).slice(2,8).toUpperCase();while(S.u.some(x=>x.code===c));return c}
function bal(uid){const now=TODAY();return S.rw.filter(r=>r.u===uid&&r.st==='available'&&r.exp>=now).reduce((a,r)=>a+r.amt,0)-S.rd.filter(r=>r.u===uid&&r.st!=='rejected').reduce((a,r)=>a+r.amt,0)}
function due(){const u=me();if(u.role!=='customer')return;S.rem.filter(r=>r.u===u.id&&!r.done).forEach(r=>{const k='r'+r.id+r.next;if(add(r.next,-(r.before??u.pref.days))<=TODAY()&&!S.nt.some(n=>n.k===k)){S.nt.unshift({id:id(),k,u:u.id,t:`Maintenance due ${r.next}: ${r.appl||catn(r.cat)}`,at:TODAY(),rd:0});save()}})}
const catn=i=>S.cats.find(c=>c.id==i)?.name||'Other';
const V={};
// ---- customer
V.customerbk=()=>{const t=S.u.filter(x=>x.role==='technician');return `<div class="card"><h2>Request a service</h2><div class="row"><label>Category<select id="b_c">${S.cats.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></label><label>Address<input id="b_a"></label><label>Technician<select id="b_t">${t.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></label><button onclick="newBk()">Book</button></div>${t.length?'':'<span class="mu">No technicians registered yet.</span>'}</div>`+bkList(me().id)};
function newBk(b){const u=me();const c=b?.cat||+b_c.value,a=b?.addr||b_a.value.trim(),t=b?.tech||+b_t?.value;if(!a||!t)return alert('Address and technician are required.');S.bk.push({id:id(),cust:u.id,tech:t,cat:c,addr:a,st:'requested',est:null,at:TODAY(),rid:b?.rid});note(t,'New booking request from '+u.name);audit('booking',a);save();tab='bk';R()}
function bkList(uid){const u=me(),L=S.bk.filter(b=>u.role==='customer'?b.cust===uid:b.tech===uid);return `<div class="card"><h2>${u.role==='customer'?'My bookings':'Assigned jobs'}</h2><div class="tw"><table><tr><th>Ref</th><th>Service</th><th>Address</th><th>Status</th><th>Estimate</th><th></th></tr>${L.map(b=>`<tr><td>BK-${b.id}</td><td>${esc(catn(b.cat))}</td><td>${esc(b.addr)}</td><td><span class="pill">${b.st}</span></td><td>${b.est?`Labour ${rs(b.est.lab)}, parts ${rs(b.est.parts)}, fees ${rs(b.est.fee)} = <b>${rs(b.est.lab+b.est.parts+b.est.fee)}</b>`:'—'}</td><td>${bkAct(b,u)}</td></tr>`).join('')||'<tr><td colspan=6 class="mu">None yet.</td></tr>'}</table></div></div>`}
function bkAct(b,u){let h='';if(u.role==='customer'){if(b.st==='estimated')h+=`<button onclick="appr(${b.id})">Approve estimate</button> `;if(['requested','estimated','approved'].includes(b.st))h+=`<button class="d" onclick="cancelBk(${b.id})">Cancel</button>`}
 else{if(['requested','estimated','approved'].includes(b.st))h+=`<div class="row"><label>Labour<input id="l${b.id}" type="number" min="0" size=6 style="width:80px"></label><label>Parts<input id="p${b.id}" type="number" min="0" style="width:80px"></label><label>Fees<input id="f${b.id}" type="number" min="0" style="width:80px"></label><label>Warranty<input id="w${b.id}" style="width:110px"></label><button onclick="est(${b.id})">${b.est?'Revise':'Send'} estimate</button></div>`;if(b.st==='approved')h+=`<button class="on" onclick="done(${b.id})">Mark completed</button>`}return h}
function est(i){const b=S.bk.find(x=>x.id===i),g=k=>Math.max(0,+document.getElementById(k+i).value||0),l=g('l');if(!l)return alert('Labour must be greater than 0.');b.est={lab:l,parts:g('p'),fee:g('f'),w:document.getElementById('w'+i).value.trim()};b.st='estimated';note(b.cust,'Estimate awaiting your approval for BK-'+i);audit('estimate','BK-'+i);save();R()}
function appr(i){const b=S.bk.find(x=>x.id===i);b.st='approved';b.est.ok=new Date().toISOString();audit('estimate approved','BK-'+i);save();R()}
function cancelBk(i){S.bk.find(x=>x.id===i).st='cancelled';audit('cancel','BK-'+i);save();R()}
function done(i){const b=S.bk.find(x=>x.id===i);if(!b.est?.ok)return alert('Estimate must be approved first.');b.st='completed';b.done=TODAY();const tot=b.est.lab+b.est.parts+b.est.fee;
 S.inv.push({id:id(),no:'INV-'+new Date().getFullYear()+'-'+String(S.inv.length+1).padStart(5,'0'),bk:i,ps:'unpaid',gen:new Date().toISOString(),revs:[{v:1,lab:b.est.lab,parts:b.est.parts,fee:b.est.fee,disc:0,total:tot,why:'Generated from approved estimate',at:new Date().toISOString()}],hist:[{s:'unpaid',at:new Date().toISOString(),by:'system'}]});
 S.hist.push({id:id(),u:b.cust,cat:b.cat,appl:'',date:b.done,bk:i});note(b.cust,'Job BK-'+i+' completed. Invoice available.');audit('invoice created','BK-'+i);qualify(b.cust);save();R()}
function qualify(cid){const r=S.ref.find(x=>x.to===cid&&x.st==='registered');if(!r||!S.camp.on)return;if(S.bk.filter(b=>b.cust===cid&&b.st==='completed').length<S.camp.minBk)return;
 r.st='qualified';S.rw.push({id:id(),u:r.by,ref:r.id,amt:S.camp.amt,st:r.flag?'pending_review':'available',exp:add(TODAY(),S.camp.expiry),at:TODAY()});note(r.by,'Referral milestone reached: '+U(cid).name+' completed a booking.');audit('reward created',rs(S.camp.amt)+' for '+U(r.by).name+(r.flag?' (held: '+r.flag+')':''))}
V.customerrf=()=>{const u=me(),link=location.href.split('#')[0]+'#ref='+u.code,msg=encodeURIComponent('Join KaamConnect with my code '+u.code+': '+link),R_=S.ref.filter(x=>x.by===u.id);
 return `<div class="card"><h2>Your referral code</h2><p style="font-size:22px"><b>${u.code}</b></p><div class="row"><button onclick="navigator.clipboard?.writeText('${link}').then(()=>alert('Link copied'))">Copy link</button><a href="https://wa.me/?text=${msg}" target="_blank"><button class="g">WhatsApp</button></a><a href="sms:?body=${msg}"><button class="g">SMS</button></a><button class="g" onclick="navigator.share?navigator.share({text:decodeURIComponent('${msg}')}):alert('Sharing not supported here')">Other apps</button></div><p class="mu">Reward: ${rs(S.camp.amt)} after the referred customer completes ${S.camp.minBk} booking(s). Valid ${S.camp.expiry} days.</p></div>
 <div class="card"><h2>Rewards</h2><p>Available balance: <b>${rs(bal(u.id))}</b></p><div class="row"><label>Redeem amount<input id="rd_a" type="number" min="1"></label><button onclick="redeem()">Request redemption</button></div><p class="mu">Redemptions are reviewed by an administrator. No money moves automatically.</p>
 <h3>Referral history</h3>${tbl(['Referred','Status','Date'],R_.map(r=>[U(r.to).name,r.st,r.at.slice(0,10)]))}<h3>Reward transactions</h3>${tbl(['Amount','Status','Expires'],S.rw.filter(r=>r.u===u.id).map(r=>[rs(r.amt),r.st,r.exp]))}<h3>Redemptions</h3>${tbl(['Amount','Status','Date'],S.rd.filter(r=>r.u===u.id).map(r=>[rs(r.amt),r.st,r.at]))}</div>`}
function tbl(h,rows){return `<div class="tw"><table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map(c=>`<td>${typeof c==='string'&&c.startsWith('<')?c:esc(c)}</td>`).join('')}</tr>`).join('')||`<tr><td colspan=${h.length} class="mu">Nothing yet.</td></tr>`}</table></div>`}
function redeem(){const a=+rd_a.value,u=me();if(!(a>0)||a>bal(u.id))return alert('Amount exceeds your available balance.');S.rd.push({id:id(),u:u.id,amt:a,st:'requested',at:TODAY()});audit('redemption requested',rs(a));save();R()}
V.customerhm=()=>{const u=me(),L=S.rem.filter(r=>r.u===u.id),cs=S.cats,done=S.bk.filter(b=>b.cust===u.id&&b.st==='completed');
 return `<div class="card"><h2>Add maintenance reminder</h2><div class="row"><label>Category<select id="m_c" onchange="sug()">${cs.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></label><label>Appliance / equipment<input id="m_a" placeholder="e.g. Haier 1.5 ton AC"></label><label>Last service<input id="m_l" type="date"></label><label>Next maintenance<input id="m_n" type="date"></label><label>Remind days before<input id="m_b" type="number" min="0" value="${u.pref.days}" style="width:80px"></label><label>Repair Passport link<select id="m_p"><option value="">None</option>${done.map(b=>`<option value="${b.id}">BK-${b.id} ${esc(catn(b.cat))} ${b.done}</option>`).join('')}</select></label><label>Notes<input id="m_o"></label><button onclick="addRem()">Save</button></div><p class="mu" id="sg"></p></div>
 <div class="card"><h2>My reminders</h2>${L.map(r=>`<div style="border-top:1px solid var(--bd);padding:8px 0"><b>${esc(catn(r.cat))}</b> ${esc(r.appl)} <span class="pill">${r.done?'completed':'next '+r.next}</span><div class="mu">Last: ${r.last||'—'} · remind ${r.before}d before ${r.bk?'· Passport BK-'+r.bk:''} ${r.note?'· '+esc(r.note):''}</div>${r.done?'':`<button class="g" onclick="post(${r.id})">Postpone 7d</button> <button class="g" onclick="edit(${r.id})">Edit date</button> <button class="on" onclick="fin(${r.id})">Mark completed</button> <button onclick="newBk({cat:${r.cat},addr:prompt('Service address')||'',tech:+prompt('Technician ID: ${S.u.filter(x=>x.role==='technician').map(x=>x.id+'='+x.name).join(', ')}'),rid:${r.id}})">Book service</button> `}<button class="d" onclick="S.rem=S.rem.filter(x=>x.id!==${r.id});save();R()">Delete</button></div>`).join('')||'<span class="mu">No reminders yet.</span>'}</div>
